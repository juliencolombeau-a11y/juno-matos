name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    env:
      NITRO_PRESET: cloudflare_module
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDINARY_CLOUD_NAME: ${{ vars.CLOUDINARY_CLOUD_NAME }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NUXT_SESSION_PASSWORD: ${{ secrets.NUXT_SESSION_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate session secret
        run: node -e 'if (!process.env.NUXT_SESSION_PASSWORD || process.env.NUXT_SESSION_PASSWORD.length < 32) { console.error("Set the Production environment secret NUXT_SESSION_PASSWORD to a value of at least 32 characters."); process.exit(1) }'

      - name: Validate Cloudinary secrets
        env:
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: node -e 'if (!process.env.CLOUDINARY_API_KEY || !process.env.CLOUDINARY_API_SECRET) { console.error("Set the Production environment secrets CLOUDINARY_API_KEY and CLOUDINARY_API_SECRET."); process.exit(1) }'

      - name: Typecheck
        run: npx nuxt typecheck

      - name: Build for Cloudflare Workers
        run: npm run build

      - name: Deploy Worker
        run: npx wrangler deploy --config .output/server/wrangler.json --keep-vars

      - name: Sync Cloudinary secrets to Worker
        env:
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          printf '%s' "$CLOUDINARY_API_KEY" | npx wrangler secret put CLOUDINARY_API_KEY --config .output/server/wrangler.json
          printf '%s' "$CLOUDINARY_API_SECRET" | npx wrangler secret put CLOUDINARY_API_SECRET --config .output/server/wrangler.json

      - name: Verify Cloudinary secret bindings
        run: |
          npx wrangler secret list --config .output/server/wrangler.json --format json | node -e '
            let input = "";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const secrets = JSON.parse(input);
              const names = new Set(secrets.map(secret => secret.name));
              const missing = ["CLOUDINARY_API_KEY", "CLOUDINARY_API_SECRET"].filter(name => !names.has(name));
              if (missing.length) {
                console.error(`Cloudflare Worker is missing required secret bindings: ${missing.join(", ")}`);
                process.exit(1);
              }
              console.log("Cloudinary secret bindings are configured.");
            });
          '
