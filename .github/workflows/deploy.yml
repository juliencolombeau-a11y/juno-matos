name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    env:
      NITRO_PRESET: cloudflare_module
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDINARY_CLOUD_NAME: ${{ vars.CLOUDINARY_CLOUD_NAME }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NUXT_SESSION_PASSWORD: ${{ secrets.NUXT_SESSION_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate session secret
        run: node -e 'if (!process.env.NUXT_SESSION_PASSWORD || process.env.NUXT_SESSION_PASSWORD.length < 32) { console.error("Set the Production environment secret NUXT_SESSION_PASSWORD to a value of at least 32 characters."); process.exit(1) }'

      - name: Typecheck
        run: npx nuxt typecheck

      - name: Build for Cloudflare Workers
        run: npm run build

      - name: Deploy Worker
        run: npx wrangler deploy --config .output/server/wrangler.json
